<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>TALavagna</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="desk"></div>

  <div id="dock">
    <div class="dock-brand">
      <img src="../build/icon.png" alt="">
      <span>TALavagna</span>
    </div>
    <button id="btn-add" class="dock-btn round" title="Aggiungi o riapri una finestra">+</button>
    <div id="dock-min"></div>
    <div class="dock-spacer"></div>
    <button id="btn-tidy" class="dock-btn" title="Disponi tutte le finestre aperte in griglia">Disponi</button>
    <button id="btn-settings" class="dock-btn round" title="Impostazioni">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <div id="clock"></div>
  </div>

  <div id="menu-add" class="popover hidden"></div>
  <div id="palette" class="popover hidden"></div>
  <div id="modal-wrap" class="hidden"><div id="modal"></div></div>
  <div id="toast" class="hidden"></div>

  <script src="app.js"></script>
</body>
</html>
